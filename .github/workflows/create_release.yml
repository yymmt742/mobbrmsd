name: Create Release Branch

on:
  workflow_dispatch:
    inputs:
      version:
        description: '作成するバージョンを入力してください (例: 0.0.30)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Create release branch and publish
    runs-on: ubuntu-latest

    env:
      VERSION_STRING: ${{ github.event.inputs.version }}
      RELEASE_BRANCH_NAME: release/${{ github.event.inputs.version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        allow-prereleases: true

    - name: Setup Fortran
      uses: fortran-lang/setup-fortran@v1
      with:
        compiler: gcc
        version: 13

    - name: Configure git
      run: |
        git config user.name "yymmt742"
        git config user.email "yymmt@kuchem.kyoto-u.ac.jp"

    - name: Create and push release branch
      run: |
        git checkout -b ${{ env.RELEASE_BRANCH_NAME }}
        git push --set-upstream origin ${{ env.RELEASE_BRANCH_NAME }}

    - name: Update version in pyproject.toml
      run: sed -i '/^version =/c version = "${{ env.VERSION_STRING }}"' pyproject.toml

    - name: Commit version bump
      run: |
        git add pyproject.toml
        git commit -m "[release] bump version to ${{ env.VERSION_STRING }}"
        git push

    - name: Create and push tag
      run: |
        git tag "v${{ env.VERSION_STRING }}"
        git push origin "v${{ env.VERSION_STRING }}"

    - name: Install build tools
      run: pip install build

    - name: Build distribution
      run: python -m build

    - name: Sign with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.0.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        gh release create "v${{ env.VERSION_STRING }}" \
          --repo "${{ github.repository }}" \
          --title "v${{ env.VERSION_STRING }}" \
          --notes ""

    - name: Upload artifacts to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        gh release upload "v${{ env.VERSION_STRING }}" dist/** \
          --repo "${{ github.repository }}"
