site_name: mobbrmsd
site_description: Molecular-Oriented RMSD with Branch-and-Bound
site_url: https://yymmt742.github.io/mobbrmsd/

repo_name: yymmt742/mobbrmsd
repo_url: https://github.com/yymmt742/mobbrmsd

theme:
  name: material

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            members_order: source
            members: false
            filters:
              - "!^_"
            docstring_section_style: table
            merge_init_into_class: true
            separate_signature: true
            show_signature: true
            show_signature_annotations: true
            show_docstring_parameters: true
            members_order: source
            inherited_members: false
            modernize_annotations: true


markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  version:
    provider: mike

nav:
  - Home: index.md

  - Getting Started:
      - Installation: installation.md
      - Quick Start: quickstart.md

  - Usage:
      - Overview: usage/index.md
      - Input format: usage/input.md

  - Theory:
      - Overview: theory/index.md
      - mobbRMSD: theory/mobbrmsd.md

  - API Reference:
      - Overview: api/index.md
      - Data classes: api/dataclass.md
      - mobbRMSD: api/mobbrmsd.md
